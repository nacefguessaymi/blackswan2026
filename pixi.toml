[workspace]
authors = ["Nacef Guessaymi <nacefguess@hotmail.com>"]
channels = ["conda-forge"]
name = "blackswan2026"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
run = { cmd = "python -m blackswan2026.main", env = { FRED_API_KEY = "$FRED_API_KEY" } }

[dependencies]
python = ">=3.11,<3.12"
pandas = ">=3.0.1,<4"
numpy = ">=2.4.2,<3"
matplotlib = ">=3.10.8,<4"
yfinance = ">=0.2.57,<0.3"
requests = ">=2.32.5,<3"
scipy = ">=1.17.1,<2"
hatchling = ">=1.28.0,<2"
black = ">=26.1.0,<27"

